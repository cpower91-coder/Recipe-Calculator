<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bratt Pan, Gastro & Flask Batch Balancer</title>
<style>
  :root {
    --bg: #121826;
    --card-bg: #1e293b;
    --card-border: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #38bdf8;
    --accent-hover: #0284c7;
    --danger: #f43f5e;
    --success: #10b981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  body {
    background-color: var(--bg);
    color: var(--text-main);
    padding: 16px;
    max-width: 1200px;
    margin: 0 auto;
    padding-bottom: 60px;
  }

  header {
    text-align: center;
    margin-bottom: 24px;
    padding: 16px;
    background: var(--card-bg);
    border-radius: 12px;
    border: 1px solid var(--card-border);
  }

  h1 { font-size: 1.6rem; color: #38bdf8; margin-bottom: 6px; }
  p.subtitle { color: var(--text-muted); font-size: 0.9rem; }

  .dish-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .dish-card {
    background: var(--card-bg);
    border-radius: 12px;
    border: 2px solid var(--card-border);
    overflow: hidden;
  }

  .dish-card-header {
    padding: 12px 16px;
    color: #fff;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 1.1rem;
  }

  .flask-badge {
    background: rgba(0,0,0,0.4);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border: 1px solid rgba(255,255,255,0.3);
    font-weight: bold;
  }

  .dish-body { padding: 16px; }

  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
    background: #0f172a;
    color: #fff;
    font-size: 0.95rem;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

  .component-block {
    background: #0f172a;
    border-radius: 8px;
    padding: 12px;
    margin-top: 12px;
    border-left: 4px solid var(--accent);
  }

  .component-block.starch { border-left-color: #f59e0b; }

  .component-title {
    font-size: 0.9rem;
    font-weight: bold;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .component-block.starch .component-title { color: #f59e0b; }

  .btn {
    background: var(--accent);
    color: #0f172a;
    font-weight: bold;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-danger:hover { background: #e11d48; }

  .results-section { margin-top: 30px; }

  .result-card {
    background: var(--card-bg);
    border-radius: 12px;
    border: 1px solid var(--card-border);
    margin-bottom: 20px;
    overflow: hidden;
  }

  .result-header {
    padding: 12px 16px;
    font-weight: bold;
    font-size: 1.1rem;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .result-body { padding: 16px; }

  .pan-breakdown {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }

  .pan-box {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 12px;
  }

  .progress-bar-bg {
    background: #334155;
    height: 12px;
    border-radius: 6px;
    overflow: hidden;
    margin: 8px 0;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s;
  }

  .ing-list {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 8px;
    border-top: 1px solid #334155;
    padding-top: 8px;
  }
  .ing-list li { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .ing-list strong { color: var(--text-main); }

  /* 6 COLOUR CODES REQUESTED */
  .flask-color-blue { background-color: #2563eb; border-color: #2563eb; }
  .flask-color-red { background-color: #dc2626; border-color: #dc2626; }
  .flask-color-orange { background-color: #ea580c; border-color: #ea580c; }
  .flask-color-yellow { background-color: #d97706; border-color: #d97706; }
  .flask-color-green { background-color: #16a34a; border-color: #16a34a; }
  .flask-color-pink { background-color: #db2777; border-color: #db2777; }

  .action-bar {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 20px;
  }

  .chain-summary {
    background: #0f172a;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 12px;
    border: 1px solid #334155;
    font-size: 0.9rem;
  }

  @media print {
    body { background: white; color: black; }
    .dish-card, .result-card { border: 1px solid #ccc; background: white; color: black; page-break-inside: avoid; }
    .action-bar, .btn { display: none; }
    input, select, textarea { border: none; background: transparent; color: black; }
    .progress-bar-bg { border: 1px solid #000; }
  }
</style>
</head>
<body>

<header>
  <h1>🍳 Bratt Pan, Gastro & Flask Equalizer</h1>
  <p class="subtitle">Multi-Dish Batch Scaler: Bratt Pan ➔ Gastros ➔ Flasks</p>
</header>

<div id="dishes-container" class="dish-grid"></div>

<div class="action-bar">
  <button class="btn" onclick="addDish()">+ Add Another Dish</button>
  <button class="btn" style="background: #10b981; color: white;" onclick="calculateAll()">⚡ Calculate Production Schedule</button>
</div>

<div id="results-container" class="results-section"></div>

<script>
const FLASK_COLORS = [
  { name: "Blue Flask", class: "flask-color-blue", hex: "#2563eb" },
  { name: "Red Flask", class: "flask-color-red", hex: "#dc2626" },
  { name: "Orange Flask", class: "flask-color-orange", hex: "#ea580c" },
  { name: "Yellow Flask", class: "flask-color-yellow", hex: "#d97706" },
  { name: "Green Flask", class: "flask-color-green", hex: "#16a34a" },
  { name: "Pink Flask", class: "flask-color-pink", hex: "#db2777" }
];

let dishes = [
  {
    id: 1,
    name: "Beef Stroganoff & Rice",
    portionsNeeded: 2400,
    flaskIndex: 0,
    flasksCount: 12, // e.g. 2,400 portions divided into 12 flasks
    gastroCapacity: 40, // portions per gastro pan
    main: {
      name: "Beef Stroganoff",
      panCapacity: 120, // portions per 1 full Bratt Pan
      ingredients: "Beef: 15kg\nStock: 10L\nOnions: 3kg\nSour Cream: 2L"
    },
    starch: {
      name: "Basmati Rice",
      panCapacity: 150, // portions per Bratt Pan / Steamer batch
      ingredients: "Rice: 10kg\nWater: 15L\nSalt: 100g"
    }
  }
];

function renderDishes() {
  const container = document.getElementById('dishes-container');
  container.innerHTML = '';

  dishes.forEach((dish, index) => {
    const colorObj = FLASK_COLORS[dish.flaskIndex % FLASK_COLORS.length];
    
    const card = document.createElement('div');
    card.className = 'dish-card';
    card.innerHTML = `
      <div class="dish-card-header ${colorObj.class}">
        <span>Dish #${index + 1}</span>
        <span class="flask-badge">${colorObj.name}</span>
      </div>
      <div class="dish-body">
        <div class="form-group">
          <label>Dish / Menu Name</label>
          <input type="text" value="${dish.name}" oninput="dishes[${index}].name = this.value">
        </div>

        <div class="form-group">
          <label>Flask Colour Tag</label>
          <select onchange="dishes[${index}].flaskIndex = parseInt(this.value); renderDishes();">
            ${FLASK_COLORS.map((c, i) => `<option value="${i}" ${i === dish.flaskIndex ? 'selected' : ''}>${c.name}</option>`).join('')}
          </select>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <div class="form-group">
            <label>Total Portions</label>
            <input type="number" value="${dish.portionsNeeded}" oninput="dishes[${index}].portionsNeeded = parseFloat(this.value) || 0">
          </div>
          <div class="form-group">
            <label>Total Flasks to Fill</label>
            <input type="number" value="${dish.flasksCount}" oninput="dishes[${index}].flasksCount = parseFloat(this.value) || 1">
          </div>
        </div>

        <div class="form-group">
          <label>Portions Per 1 Gastro Pan</label>
          <input type="number" value="${dish.gastroCapacity}" oninput="dishes[${index}].gastroCapacity = parseFloat(this.value) || 1">
        </div>

        <!-- MAIN -->
        <div class="component-block">
          <div class="component-title">🥘 MAIN COMPONENT</div>
          <div class="form-group">
            <label>Main Name</label>
            <input type="text" value="${dish.main.name}" oninput="dishes[${index}].main.name = this.value">
          </div>
          <div class="form-group">
            <label>Portions per 1 Full Bratt Pan</label>
            <input type="number" value="${dish.main.panCapacity}" oninput="dishes[${index}].main.panCapacity = parseFloat(this.value) || 1">
          </div>
          <div class="form-group">
            <label>Base Recipe Per Full Pan (Ingredient: Qty)</label>
            <textarea rows="3" oninput="dishes[${index}].main.ingredients = this.value">${dish.main.ingredients}</textarea>
          </div>
        </div>

        <!-- STARCH -->
        <div class="component-block starch">
          <div class="component-title">🍚 STARCH COMPONENT</div>
          <div class="form-group">
            <label>Starch Name</label>
            <input type="text" value="${dish.starch.name}" oninput="dishes[${index}].starch.name = this.value">
          </div>
          <div class="form-group">
            <label>Portions per 1 Full Bratt Pan / Batch</label>
            <input type="number" value="${dish.starch.panCapacity}" oninput="dishes[${index}].starch.panCapacity = parseFloat(this.value) || 1">
          </div>
          <div class="form-group">
            <label>Base Recipe Per Full Batch (Ingredient: Qty)</label>
            <textarea rows="3" oninput="dishes[${index}].starch.ingredients = this.value">${dish.starch.ingredients}</textarea>
          </div>
        </div>

        ${dishes.length > 1 ? `<button class="btn btn-danger" style="width:100%; margin-top:12px; padding:8px;" onclick="removeDish(${index})">Remove Dish</button>` : ''}
      </div>
    `;
    container.appendChild(card);
  });
}

function addDish() {
  if (dishes.length >= 6) {
    alert("Maximum of 6 dishes (1 for each colour tag).");
    return;
  }
  const newId = dishes.length + 1;
  dishes.push({
    id: newId,
    name: `Dish #${newId}`,
    portionsNeeded: 1200,
    flaskIndex: dishes.length % 6,
    flasksCount: 6,
    gastroCapacity: 40,
    main: { name: "Main Dish", panCapacity: 120, ingredients: "Beef: 10kg\nSauce: 5L" },
    starch: { name: "Starch Side", panCapacity: 150, ingredients: "Rice: 8kg\nWater: 12L" }
  });
  renderDishes();
}

function removeDish(index) {
  dishes.splice(index, 1);
  renderDishes();
}

function parseIngredients(text) {
  if (!text) return [];
  const lines = text.split('\n');
  return lines.map(line => {
    const parts = line.split(':');
    if (parts.length === 2) {
      const name = parts[0].trim();
      const valMatch = parts[1].trim().match(/^([\d\.]+)\s*(.*)$/);
      if (valMatch) {
        return { name, amount: parseFloat(valMatch[1]), unit: valMatch[2] };
      }
    }
    return null;
  }).filter(item => item !== null);
}

function calculateComponent(targetPortions, comp) {
  const exactPans = targetPortions / (comp.panCapacity || 1);
  const physicalPans = Math.ceil(exactPans) || 1;
  const fillPercent = ((exactPans / physicalPans) * 100).toFixed(1);
  const scaleFactor = exactPans / physicalPans;
  const portionsPerPan = (targetPortions / physicalPans).toFixed(1);

  const baseIngredients = parseIngredients(comp.ingredients);
  const scaledIngredients = baseIngredients.map(ing => ({
    name: ing.name,
    perPan: (ing.amount * scaleFactor).toFixed(2),
    totalJob: (ing.amount * scaleFactor * physicalPans).toFixed(2),
    unit: ing.unit
  }));

  return { exactPans, physicalPans, fillPercent, scaleFactor, portionsPerPan, scaledIngredients };
}

function calculateAll() {
  const container = document.getElementById('results-container');
  container.innerHTML = '<h2 style="margin-bottom:16px; color:#38bdf8;">📋 Daily Production & Container Breakdown</h2>';

  dishes.forEach((dish) => {
    const colorObj = FLASK_COLORS[dish.flaskIndex % FLASK_COLORS.length];
    
    // Calculations
    const totalGastros = (dish.portionsNeeded / (dish.gastroCapacity || 1)).toFixed(1);
    const gastrosPerFlask = (totalGastros / (dish.flasksCount || 1)).toFixed(1);
    const portionsPerFlask = (dish.portionsNeeded / (dish.flasksCount || 1)).toFixed(0);

    const mainCalc = calculateComponent(dish.portionsNeeded, dish.main);
    const starchCalc = calculateComponent(dish.portionsNeeded, dish.starch);

    const mainGastrosPerPan = (mainCalc.portionsPerPan / dish.gastroCapacity).toFixed(1);
    const starchGastrosPerPan = (starchCalc.portionsPerPan / dish.gastroCapacity).toFixed(1);

    const resCard = document.createElement('div');
    resCard.className = 'result-card';
    resCard.innerHTML = `
      <div class="result-header ${colorObj.class}">
        <span>${dish.name}</span>
        <span class="flask-badge">🏷️ ${colorObj.name}</span>
      </div>
      <div class="result-body">
        
        <!-- CONTAINER BREAKDOWN CHAIN -->
        <div class="chain-summary">
          <strong style="color:#38bdf8;">📦 Container & Flask Chain:</strong><br>
          • <strong>Total Order:</strong> ${dish.portionsNeeded.toLocaleString()} portions ➔ <strong>${dish.flasksCount} ${colorObj.name}s</strong> (${portionsPerFlask} portions per flask).<br>
          • <strong>Total Gastros Required:</strong> <strong>${totalGastros} Gastro Trays</strong> (${dish.gastroCapacity} portions/gastro).<br>
          • <strong>Per Flask Fill:</strong> Each ${colorObj.name} takes <strong>${gastrosPerFlask} Gastros</strong>.
        </div>

        <!-- MAIN BREAKDOWN -->
        <h3 style="color:#38bdf8; margin-top:16px; margin-bottom:8px;">🥘 MAIN: ${dish.main.name}</h3>
        <p style="font-size:0.88rem; color:#94a3b8; margin-bottom:10px;">
          Cook in <strong>${mainCalc.physicalPans} Bratt Pan(s)</strong> equalized at <strong style="color:#10b981">${mainCalc.fillPercent}% capacity</strong>.<br>
          Each Bratt Pan yields <strong>${mainCalc.portionsPerPan} portions</strong> ➔ fills <strong>${mainGastrosPerPan} Gastros</strong> ➔ feeds into <strong>${colorObj.name}s</strong>.
        </p>
        <div class="pan-breakdown">${renderPanBoxes(mainCalc, colorObj.hex)}</div>

        <hr style="border:0; border-top:1px solid #334155; margin:20px 0;">

        <!-- STARCH BREAKDOWN -->
        <h3 style="color:#f59e0b; margin-bottom:8px;">🍚 STARCH: ${dish.starch.name}</h3>
        <p style="font-size:0.88rem; color:#94a3b8; margin-bottom:10px;">
          Cook in <strong>${starchCalc.physicalPans} Batch(es)</strong> equalized at <strong style="color:#10b981">${starchCalc.fillPercent}% capacity</strong>.<br>
          Each Batch yields <strong>${starchCalc.portionsPerPan} portions</strong> ➔ fills <strong>${starchGastrosPerPan} Gastros</strong> ➔ feeds into <strong>${colorObj.name}s</strong>.
        </p>
        <div class="pan-breakdown">${renderPanBoxes(starchCalc, "#f59e0b")}</div>

      </div>
    `;
    container.appendChild(resCard);
  });
}

function renderPanBoxes(calc, colorHex) {
  let boxesHtml = '';
  for (let i = 1; i <= calc.physicalPans; i++) {
    boxesHtml += `
      <div class="pan-box">
        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:0.9rem;">
          <span>Pan #${i} of ${calc.physicalPans}</span>
          <span style="color:${colorHex};">${calc.fillPercent}% Full</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width: ${calc.fillPercent}%; background-color: ${colorHex};"></div>
        </div>
        <div style="font-size:0.8rem; color:#94a3b8; margin-bottom:6px;">
          Batch Yield: <strong>${calc.portionsPerPan} portions</strong>
        </div>
        <div class="ing-list">
          <div style="font-weight:bold; margin-bottom:4px; color:#fff;">Ingredients per pan:</div>
          <ul>
            ${calc.scaledIngredients.length > 0 ? calc.scaledIngredients.map(ing => `<li><span>${ing.name}</span> <strong>${ing.perPan} ${ing.unit}</strong></li>`).join('') : '<li style="font-style:italic;">No ingredients parsed</li>'}
          </ul>
        </div>
      </div>
    `;
  }
  return boxesHtml;
}

renderDishes();
</script>
</body>
</html>
