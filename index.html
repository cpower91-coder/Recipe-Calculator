<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bratt Pan Production Calculator</title>
  <style>
    :root {
      --primary: #0f5132;
      --primary-hover: #0b3d26;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #212529;
      --subtext: #6c757d;
      --border: #e2e8f0;
      --accent-bg: #e8f5e9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      max-width: 650px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      color: var(--primary);
      font-size: 1.6rem;
      font-weight: 700;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--primary);
      font-weight: 600;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 500px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    input {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      margin-top: 14px;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    /* Stat Cards Dashboard Layout */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: var(--bg);
      border-radius: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--subtext);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .total-banner {
      background: var(--accent-bg);
      border: 1px solid #c8e6c9;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }

    .total-banner .stat-label {
      color: #2e7d32;
    }

    .total-banner .stat-value {
      font-size: 1.5rem;
      color: #1b5e20;
    }

    .print-btn {
      background: #334155;
    }

    .print-btn:hover {
      background: #1e293b;
    }

    /* Clean Print-Friendly Overrides */
    @media print {
      button, 
      .no-print, 
      .input-card {
        display: none !important;
      }

      body {
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0;
        margin: 0;
        max-width: 100% !important;
      }

      .card {
        box-shadow: none !important;
        border: 1px solid #000 !important;
        padding: 16px !important;
      }

      .stat-box, .total-banner {
        background: none !important;
        border: 1px solid #aaa !important;
      }

      .stat-value, .total-banner .stat-value, header h1, .card h2 {
        color: #000 !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Bratt Pan Batch Calculator</h1>
  </header>

  <!-- Input Card -->
  <div class="card input-card">
    <h2>Batch Settings</h2>
    <form id="calc-form">
      <div class="form-grid">
        <div class="field">
          <label for="pan-capacity">Bratt Pan Capacity (Liters)</label>
          <input type="number" id="pan-capacity" value="80" min="1" step="0.5" required />
        </div>
        <div class="field">
          <label for="total-volume">Total Recipe Volume (Liters)</label>
          <input type="number" id="total-volume" value="250" min="1" step="0.5" required />
        </div>
        <div class="field">
          <label for="cook-time">Cook Time / Batch (Mins)</label>
          <input type="number" id="cook-time" value="45" min="1" step="1" required />
        </div>
        <div class="field">
          <label for="turnaround-time">Wash & Reload Time (Mins)</label>
          <input type="number" id="turnaround-time" value="15" min="0" step="1" required />
        </div>
      </div>
      <button type="submit">Recalculate Batch Plan</button>
    </form>
  </div>

  <!-- Output Results Card -->
  <div class="card">
    <h2>Production Summary</h2>
    
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Total Batches</div>
        <div class="stat-value" id="res-batches">-</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Volume / Batch</div>
        <div class="stat-value" id="res-batch-vol">-</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Cycle Time</div>
        <div class="stat-value" id="res-single-time">-</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Clean & Reloads</div>
        <div class="stat-value" id="res-turns">-</div>
      </div>
    </div>

    <div class="total-banner">
      <div class="stat-label">ESTIMATED TOTAL PRODUCTION TIME</div>
      <div class="stat-value" id="res-total-time">-</div>
    </div>
  </div>

  <button class="no-print print-btn" onclick="window.print()">🖨️ Print Batch Sheet</button>

  <script>
    const form = document.getElementById('calc-form');

    function calculate() {
      const panCap = parseFloat(document.getElementById('pan-capacity').value) || 0;
      const totalVol = parseFloat(document.getElementById('total-volume').value) || 0;
      const cookTime = parseFloat(document.getElementById('cook-time').value) || 0;
      const turnTime = parseFloat(document.getElementById('turnaround-time').value) || 0;

      if (panCap <= 0 || totalVol <= 0) return;

      const numBatches = Math.ceil(totalVol / panCap);
      const avgBatchVol = (totalVol / numBatches).toFixed(1);
      const singleCycleTime = cookTime + turnTime;
      
      // Total production time = all cook cycles + intermediate wash/reload times
      const totalMinutes = (numBatches * cookTime) + ((numBatches - 1) * turnTime);

      const hours = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;
      const timeFormatted = hours > 0 ? `${hours}h ${mins}m` : `${mins} mins`;

      document.getElementById('res-batches').textContent = `${numBatches}`;
      document.getElementById('res-batch-vol').textContent = `${avgBatchVol} L`;
      document.getElementById('res-single-time').textContent = `${singleCycleTime} mins`;
      document.getElementById('res-turns').textContent = `${numBatches - 1}`;
      document.getElementById('res-total-time').textContent = `${timeFormatted} (${totalMinutes}m)`;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      calculate();
    });

    calculate();
  </script>
</body>
</html>
