<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bratt Pan Batch & Time Calculator</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      color: var(--primary);
      font-size: 1.8rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: var(--primary);
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    input {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    button:hover {
      background: var(--primary-hover);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f1f5f9;
      color: var(--primary);
      font-weight: 700;
    }

    .highlight-row {
      font-weight: 700;
      font-size: 1.1rem;
      background-color: #eff6ff;
    }

    /* Print-Friendly Rules */
    @media print {
      button, 
      .no-print, 
      .input-card {
        display: none !important;
      }

      body {
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0;
        margin: 0;
      }

      .card {
        box-shadow: none !important;
        border: 1px solid #000 !important;
        padding: 12px !important;
        margin-bottom: 12px !important;
      }

      th {
        background-color: #e2e8f0 !important;
        color: #000 !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Bratt Pan Production Calculator</h1>
  </header>

  <!-- Input Form -->
  <div class="card input-card">
    <h2>Batch Settings</h2>
    <form id="calc-form">
      <div class="grid">
        <div class="field">
          <label for="pan-capacity">Bratt Pan Max Working Capacity (Liters)</label>
          <input type="number" id="pan-capacity" value="80" min="1" step="0.5" required />
        </div>
        <div class="field">
          <label for="total-volume">Total Batch Volume Needed (Liters)</label>
          <input type="number" id="total-volume" value="250" min="1" step="0.5" required />
        </div>
        <div class="field">
          <label for="cook-time">Cook Time Per Batch (Minutes)</label>
          <input type="number" id="cook-time" value="45" min="1" step="1" required />
        </div>
        <div class="field">
          <label for="turnaround-time">Turnaround / Washout Time (Minutes)</label>
          <input type="number" id="turnaround-time" value="15" min="0" step="1" required />
        </div>
      </div>
      <button type="submit">Calculate Production Run</button>
    </form>
  </div>

  <!-- Output Results Card -->
  <div class="card">
    <h2>Production Plan & Schedule</h2>
    <table>
      <tbody>
        <tr>
          <th>Required Batches:</th>
          <td id="res-batches">-</td>
        </tr>
        <tr>
          <th>Volume Per Batch:</th>
          <td id="res-batch-vol">-</td>
        </tr>
        <tr>
          <th>Time Per Batch (Cook + Turnaround):</th>
          <td id="res-single-time">-</td>
        </tr>
        <tr class="highlight-row">
          <th>Total Production Time:</th>
          <td id="res-total-time">-</td>
        </tr>
      </tbody>
    </table>
  </div>

  <button class="no-print" onclick="window.print()" style="background: #334155;">🖨️ Print Batch Sheet</button>

  <script>
    const form = document.getElementById('calc-form');

    function calculate() {
      const panCap = parseFloat(document.getElementById('pan-capacity').value) || 0;
      const totalVol = parseFloat(document.getElementById('total-volume').value) || 0;
      const cookTime = parseFloat(document.getElementById('cook-time').value) || 0;
      const turnTime = parseFloat(document.getElementById('turnaround-time').value) || 0;

      if (panCap <= 0 || totalVol <= 0) return;

      // Calculate number of full/partial batches
      const numBatches = Math.ceil(totalVol / panCap);
      const avgBatchVol = (totalVol / numBatches).toFixed(1);

      // Time calculations
      const singleCycleTime = cookTime + turnTime;
      // Total time = (all cook times) + (turnaround times between batches, assuming no final turnaround needed)
      const totalMinutes = (numBatches * cookTime) + ((numBatches - 1) * turnTime);

      const hours = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;
      const timeFormatted = hours > 0 ? `${hours}h ${mins}m` : `${mins} mins`;

      // Display results
      document.getElementById('res-batches').textContent = `${numBatches} batch${numBatches > 1 ? 'es' : ''}`;
      document.getElementById('res-batch-vol').textContent = `~${avgBatchVol} Liters / batch`;
      document.getElementById('res-single-time').textContent = `${singleCycleTime} mins (${cookTime}m cook + ${turnTime}m clean/fill)`;
      document.getElementById('res-total-time').textContent = `${timeFormatted} (${totalMinutes} mins total)`;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      calculate();
    });

    // Run initial calculation on page load
    calculate();
  </script>
</body>
</html>
